<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시니어 안심 터치 (목업)</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f2f2f7;
      --text: #1c1c1e;
      --danger: #ff3b30;
      --warning: #ff9500;
      --success: #34c759;
      --purple: #af52de;
      --blue: #007aff;
    }
    * { box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; }
    body {
      margin: 0; padding: 0; background-color: #333;
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }
    .app-container {
      width: 100%; max-width: 414px; height: 100vh; max-height: 896px;
      background-color: var(--bg); position: relative; overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    /* 데스크톱 모니터에서 볼 때 스마트폰 형태로 보이게 처리 */
    @media (min-width: 415px) { .app-container { height: 90vh; border-radius: 20px; } }
    
    .screen {
      width: 100%; height: 100%; position: absolute; top: 0; left: 0;
      display: none; flex-direction: column; padding: 20px;
    }
    .screen.active { display: flex; }
    
    /* View 1: Setup (초기 설정) */
    .setup-title { font-size: 26px; font-weight: 900; margin-bottom: 30px; margin-top: 40px;}
    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; margin-bottom: 8px; font-weight: 700; color: #555; }
    .input-group input, .input-group select {
      width: 100%; padding: 16px; font-size: 16px; border-radius: 12px; border: 1px solid #ccc; background: white;
    }
    .btn-primary {
      margin-top: auto; margin-bottom: 20px; padding: 20px; border: none; border-radius: 16px;
      background-color: var(--blue); color: white; font-size: 20px; font-weight: 800;
      cursor: pointer; box-shadow: 0 4px 12px rgba(0,122,255,0.3);
    }

    /* View 2: Main Home (어르신 화면) */
    .onboard-hello { font-size: 26px; font-weight: 900; margin-bottom: 24px; margin-top: 20px; word-break: keep-all; line-height: 1.3; }
    .grid-container {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px; flex: 1; margin-bottom: 30px;
    }
    .grid-btn {
      border-radius: 20px; border: none; padding: 20px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      cursor: pointer; transition: transform 0.1s; text-align: center;
    }
    .grid-btn:active { transform: scale(0.95); }
    .grid-btn .emoji { font-size: 50px; margin-bottom: 12px; }
    .grid-btn .label { font-size: 24px; font-weight: 900; line-height: 1.2; word-break: keep-all; }

    /* 버튼 크기 및 색상 조정: 위젯처럼 보이게 함 */
    .btn-danger { background-color: var(--danger); color: white; grid-column: span 2; padding: 30px; } /* 응급은 가로 전체 차지 */
    .btn-warning { background-color: var(--warning); color: #fff; }
    .btn-purple { background-color: var(--purple); color: white; }
    .btn-success { background-color: var(--success); color: white; grid-column: span 2; padding: 30px; } /* 안심 도착도 가로 전체 */
    
    /* View 3: Countdown (취소 유예 화면) */
    .countdown-screen { justify-content: center; text-align: center; color: white; }
    .pulse-ring {
      width: 160px; height: 160px; border-radius: 50%; background: white; 
      display: flex; align-items: center; justify-content: center; font-size: 70px; font-weight: 900;
      margin: 0 auto 50px; box-shadow: 0 0 0 0 rgba(255,255,255, 0.7);
      animation: pulse 1s infinite cubic-bezier(0.66, 0, 0, 1);
    }
    @keyframes pulse {to {box-shadow: 0 0 0 50px rgba(255,255,255, 0);}}
    .cancel-btn {
      padding: 24px; background-color: rgba(255,255,255,0.2); border: 3px solid white; border-radius: 100px;
      color: white; font-size: 24px; font-weight: 900; cursor: pointer; margin-top: auto; margin-bottom: 30px;
    }
    .action-text {font-size: 32px; font-weight: 900; margin-bottom: 15px; word-break: keep-all; line-height: 1.3;}
  </style>
</head>
<body>

  <!-- 전체 스마트폰 프레임 -->
  <div class="app-container">
    
    <!-- 뷰 1: 보호자가 세팅해주는 초기 화면 -->
    <div id="view1" class="screen active">
      <div class="setup-title">
        <span style="font-size: 16px; color:var(--blue);">초기 설정 (보호자용)</span><br>
        시니어 안심 터치
      </div>
      
      <div class="input-group">
        <label>어르신 호칭/성함</label>
        <input type="text" id="seniorName" value="홍길동" placeholder="예: 어머니, 홍길동">
      </div>
      
      <div class="input-group">
        <label>1순위 응급연락처 (자녀 등)</label>
        <input type="tel" value="010-1234-5678">
      </div>
      
      <div class="input-group">
        <label>자동 안부 확인 알람 (무활동 감지)</label>
        <select>
          <option>12시간 동안 휴대폰 미사용 시</option>
          <option>24시간 동안 휴대폰 미사용 시</option>
          <option>사용 안 함</option>
        </select>
      </div>

      <button class="btn-primary" onclick="goToMain()">설정 저장 및 시작하기</button>
    </div>

    <!-- 뷰 2: 어르신용 메인 버튼 화면 -->
    <div id="view2" class="screen">
      <div class="onboard-hello"><span id="nameDisplay">홍길동</span> 어르신,<br>무엇을 도와드릴까요?</div>
      
      <!-- 
        목업 특성상 '아파요', '잘 도착했어요' 처럼 중요한건 100% 폭을 차지하게 하고,
        택시와 위치 전송은 절반 크기로 묶어서 2x2와 리스트형의 절충안을 시각적으로 구성했습니다.
      -->
      <div class="grid-container">
        <!-- 긴급 구조 -->
        <button class="grid-btn btn-danger" onclick="triggerAction('🚑 보호자에게 응급 도움을 요청합니다.', true)">
          <span class="emoji">🚨</span>
          <span class="label">아파요! 도움이 필요해요</span>
        </button>
        
        <!-- 택시 호출 대행 요청 -->
        <button class="grid-btn btn-warning" onclick="triggerAction('🚕 보호자에게 택시를 불러달라고 요청합니다.', false)">
          <span class="emoji">🚕</span>
          <span class="label">택시<br>필요해요</span>
        </button>
        
        <!-- 위치 전송 -->
        <button class="grid-btn btn-purple" onclick="triggerAction('🧭 보호자에게 현재 내 위치를 보냅니다.', false)">
          <span class="emoji">🧭</span>
          <span class="label">길을<br>잃었어요</span>
        </button>

        <!-- 안심 버튼 -->
        <button class="grid-btn btn-success" onclick="triggerAction('🏠 보호자에게 무사히 도착했다고 알립니다.', false)">
          <span class="emoji">🏠</span>
          <span class="label">집에 무사히 잘 도착했어요</span>
        </button>
      </div>
    </div>

    <!-- 뷰 3: 행동 전송 중 확인 및 취소 폭파 화면 -->
    <div id="view3" class="screen countdown-screen">
      <div style="flex: 1; display:flex; flex-direction:column; justify-content:center;">
        <div class="action-text" id="actionMsg">메시지 전송 중</div>
        <div style="font-size: 20px; margin-bottom: 40px; opacity: 0.9;">보호자 카카오톡으로 연결됩니다</div>
        
        <div class="pulse-ring" id="countdownTimer" style="color: var(--danger);">5</div>
      </div>
      
      <!-- 초거대 취소 버튼 -->
      <button class="cancel-btn" onclick="cancelAction()">❌ 실수로 눌렀어요 (취소)</button>
    </div>

  </div>

  <script>
    let timer;
    let secondsLeft = 5;

    // View 1 -> View 2 (환경설정 후 메인으로)
    function goToMain() {
      const name = document.getElementById('seniorName').value || '홍길동';
      document.getElementById('nameDisplay').innerText = name;
      document.getElementById('view1').classList.remove('active');
      document.getElementById('view2').classList.add('active');
    }

    // View 2 -> View 3 (버튼 클릭 시 취소 유예 카운트다운)
    function triggerAction(message, isEmergency) {
      document.getElementById('actionMsg').innerText = message;
      document.getElementById('view2').classList.remove('active');
      const view3 = document.getElementById('view3');
      view3.classList.add('active');
      
      // 배경색 동적 변경 (테마)
      if(isEmergency) {
        view3.style.backgroundColor = 'var(--danger)';
        document.getElementById('countdownTimer').style.color = 'var(--danger)';
      } else {
        view3.style.backgroundColor = '#1c1c1e'; // 다크 그레이
        document.getElementById('countdownTimer').style.color = '#1c1c1e';
      }

      secondsLeft = 5;
      document.getElementById('countdownTimer').innerText = secondsLeft;
      
      // 타이머 시작
      timer = setInterval(() => {
        secondsLeft--;
        document.getElementById('countdownTimer').innerText = secondsLeft;
        if(secondsLeft <= 0) {
          clearInterval(timer);
          alert('가상 전송 완료!\n\n(실제 환경에선 이제 SMS나 카카오톡 전송 API가 작동합니다.)');
          cancelAction(); // 전송 후 메인으로 원상복구
        }
      }, 1000);
    }

    // View 3 -> View 2 (동작 취소)
    function cancelAction() {
      clearInterval(timer);
      document.getElementById('view3').classList.remove('active');
      document.getElementById('view2').classList.add('active');
    }
  </script>
</body>
</html>
